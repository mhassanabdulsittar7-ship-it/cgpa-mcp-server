# Render blueprint (optional). Or just fill the same values in the Render dashboard.
services:
  - type: web
    name: cgpa-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.3
